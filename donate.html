<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Start a donation | ClothCare</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><nav class="navbar"><a class="logo" href="index.html"><span class="logo-mark">C</span> ClothCare</a><div class="nav-links"><a href="index.html">Home</a><a href="index.html#how-it-works">How it works</a><a href="donations.html">My donations</a><a class="nav-cta active" href="donate.html">Donate clothes &#8599;</a></div></nav></header><main class="page-shell"><div class="page-container"><div class="page-intro"><p class="section-label">A SMALL ACT, A BIG RIPPLE</p><h1>Start a <span>donation.</span></h1><p>Tell us what you are passing on and we will help it find the right hands.</p></div><form class="form-card donation-form"><h2>About you</h2><div class="form-row"><div class="form-group"><label for="name">Full name</label><input id="name" required placeholder="e.g. Aisha Patel"></div><div class="form-group"><label for="phone">Phone number</label><input id="phone" required type="tel" placeholder="Your mobile number"></div></div><div class="form-group"><label for="email">Email address</label><input id="email" required type="email" placeholder="you@example.com"></div><h2>About your clothes</h2><div class="form-row"><div class="form-group"><label for="clothing-type">What are you donating?</label><select id="clothing-type" required><option value="">Choose a category</option><option>Everyday clothes</option><option>Children's clothes</option><option>Warm layers</option><option>Formal wear</option><option>Footwear</option><option>Other</option></select></div><div class="form-group"><label for="quantity">How many pieces?</label><input id="quantity" required type="number" min="1" placeholder="e.g. 8"></div></div><div class="form-group"><label for="condition">Condition</label><select id="condition" required><option value="">Choose one</option><option>New</option><option>Like new</option><option>Good and wearable</option></select></div><div class="form-group"><label for="description">A quick note</label><textarea id="description" required rows="4" placeholder="Anything helpful about the donation"></textarea></div><h2>How should we receive it?</h2><div class="donation-method"><label><input type="radio" name="method" value="pickup" required> Arrange a pickup</label><label><input type="radio" name="method" value="dropoff"> I will drop it off</label></div><div class="form-group"><label for="address">Address or preferred drop-off area</label><textarea id="address" required rows="3" placeholder="Where should the handover happen?"></textarea></div><button class="form-submit" type="submit">Confirm my donation &#8599;</button></form></div></main><footer class="footer"><div class="footer-bottom"><span>&copy; 2026 ClothCare</span><span>Wear kindness forward.</span></div></footer><script src="script.js"></script></body></html>
