<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - ClothCare</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- Navigation Bar -->

    <header>

        <nav class="navbar">

            <div class="logo">
                ClothCare
            </div>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="index.html#about">About</a>
                </li>

                <li>
                    <a href="index.html#how-it-works">
                        How It Works
                    </a>
                </li>

                <li>
                    <a href="donate.html">Donate</a>
                </li>

                <li>
                    <a href="login.html">Login</a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- Register Section -->

    <section class="register-section">

        <div class="register-container">

            <div class="register-heading">

                <p class="section-label">
                    JOIN CLOTHCARE
                </p>

                <h1>
                    Create Your <span>Account</span>
                </h1>

                <p>
                    Join us and make a difference through clothing donations.
                </p>

            </div>


            <!-- Register Form -->

            <form class="register-form">

                <div class="form-group">

                    <label for="register-name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="register-name"
                        placeholder="Enter your full name"
                    >

                </div>


                <div class="form-group">

                    <label for="register-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="register-email"
                        placeholder="Enter your email"
                    >

                </div>


                <div class="form-group">

                    <label for="register-phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="register-phone"
                        placeholder="Enter your phone number"
                    >

                </div>


                <div class="form-group">

                    <label for="register-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="register-password"
                        placeholder="Create a password"
                    >

                </div>


                <div class="form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm your password"
                    >

                </div>


                <div class="terms">

                    <label>

                        <input type="checkbox">

                        I agree to the
                        <a href="#">Terms & Conditions</a>

                    </label>

                </div>


                <button
                    type="submit"
                    class="register-btn"
                >
                    Create Account
                </button>


                <p class="login-text">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </form>

        </div>

    </section>


    <!-- Footer -->

    <footer class="footer">

        <div class="footer-bottom">

            <p>
                © 2026 ClothCare. All rights reserved.
            </p>

        </div>

    </footer>

<script src="script.js"></script>

</body>

</html>
