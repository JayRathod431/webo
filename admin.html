<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operations | ClothCare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="admin-header">
        <div class="admin-logo">ClothCare <span>Operations</span></div>
        <a class="admin-home" href="index.html">View public site &#8599;</a>
    </header>

    <main class="admin-dashboard">
        <div class="admin-panel">
            <div id="admin-login-card" class="admin-login-card">
                <p class="section-label">ADMIN ACCESS</p>
                <h2>Welcome back, team.</h2>
                <form class="admin-login-form">
                    <div class="form-group">
                        <label for="admin-email">Admin email</label>
                        <input id="admin-email" type="email" value="admin@clothcare.org" required>
                    </div>
                    <div class="form-group">
                        <label for="admin-password">Password</label>
                        <input id="admin-password" type="password" value="admin123" required>
                    </div>
                    <button class="form-submit" type="submit">Log in to dashboard</button>
                </form>
            </div>

            <section id="admin-panel" class="hidden">
                <div class="admin-heading">
                    <div>
                        <p class="section-label">TODAY, 09 SEP 2026</p>
                        <h1>Good work, team.</h1>
                    </div>
                    <button class="logout-btn" type="button">Log out</button>
                </div>

                <div class="admin-stats">
                    <div class="admin-stat-card">
                        <span class="admin-stat-icon">&#128230;</span>
                        <div>
                            <p>Total pieces</p>
                            <h2 id="admin-total-pieces">0</h2>
                        </div>
                    </div>
                    <div class="admin-stat-card">
                        <span class="admin-stat-icon">&#9203;</span>
                        <div>
                            <p>Awaiting match</p>
                            <h2 id="admin-pending">0</h2>
                        </div>
                    </div>
                    <div class="admin-stat-card">
                        <span class="admin-stat-icon">&#10003;</span>
                        <div>
                            <p>Matched</p>
                            <h2 id="admin-matched">0</h2>
                        </div>
                    </div>
                    <div class="admin-stat-card">
                        <span class="admin-stat-icon">&#9829;</span>
                        <div>
                            <p>Partner NGOs</p>
                            <h2 id="admin-partners">42</h2>
                        </div>
                    </div>
                </div>

                <section class="admin-table">
                    <div class="table-heading">
                        <h2>Latest donations</h2>
                        <button class="filter-btn" type="button">Filter &#8595;</button>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Reference</th>
                                    <th>Donor</th>
                                    <th>Category</th>
                                    <th>Pieces</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="admin-table-body"></tbody>
                        </table>
                    </div>
                </section>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
