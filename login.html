<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ClothCare</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- Navigation Bar -->

    <header>

        <nav class="navbar">

            <div class="logo">
                ClothCare
            </div>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="index.html#about">About</a>
                </li>

                <li>
                    <a href="index.html#how-it-works">
                        How It Works
                    </a>
                </li>

                <li>
                    <a href="donate.html">Donate</a>
                </li>

                <li>
                    <a href="login.html">Login</a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- Login Section -->

    <section class="login-section">

        <div class="login-container">

            <div class="login-heading">

                <p class="section-label">
                    WELCOME BACK
                </p>

                <h1>
                    Login to <span>ClothCare</span>
                </h1>

                <p>
                    Sign in to manage your donations.
                </p>

            </div>


            <!-- Login Form -->

            <form class="login-form">

                <div class="form-group">

                    <label for="login-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="Enter your email"
                    >

                </div>


                <div class="form-group">

                    <label for="login-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Enter your password"
                    >

                </div>


                <div class="login-options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>


                <p class="register-text">

                    Don't have an account?

                    <a href="register.html">
                        Create Account
                    </a>

                </p>

            </form>

        </div>

    </section>


    <!-- Footer -->

    <footer class="footer">

        <div class="footer-bottom">

            <p>
                © 2026 ClothCare. All rights reserved.
            </p>

        </div>

    </footer>

<script src="script.js"></script>

</body>

</html>
